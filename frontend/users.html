<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Admin - ScrollBurn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="persistent-header">
        ⚡ Admin Area
    </header>

    <nav>
        <div class="logo"><a href="index.html">ScrollBurn</a></div>
        <div>
            <a href="dashboard.html">Dashboard</a>
        </div>
    </nav>

    <main>
        <section class="card">
            <h2>User Management (Admin)</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Device</th>
                        <th>Joined</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="users-list">
                    <!-- Loaded via JS -->
                </tbody>
            </table>
            <div class="pagination" id="pagination">
                <button id="prev-btn" class="btn-secondary" style="width: auto;">← Prev</button>
                <span id="page-info" style="align-self: center;">Page 1</span>
                <button id="next-btn" class="btn-secondary" style="width: auto;">Next →</button>
            </div>
        </section>
    </main>

    <script defer>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        let currentPage = 1;
        let totalPages = 1;

        async function deleteUser(id) {
            if(!confirm("Are you sure you want to delete this user? All their data will be lost.")) return;
            const res = await fetch(`/users/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if(res.ok) {
                alert("User deleted");
                loadUsers();
            } else {
                alert("Error deleting user");
            }
        }

        async function loadUsers() {
            try {
                const res = await fetch(`/users?page=${currentPage}&per_page=20`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    currentPage = data.current_page;
                    totalPages = data.pages;
                    
                    const tbody = document.getElementById('users-list');
                    tbody.innerHTML = '';
                    data.users.forEach(u => {
                        const joined = u.created_at ? u.created_at.split('T')[0] : 'N/A';
                        tbody.innerHTML += `
                            <tr>
                                <td>${u.id}</td>
                                <td>${u.username}</td>
                                <td>${u.email}</td>
                                <td>${u.device_type}</td>
                                <td>${joined}</td>
                                <td>
                                    <button class="btn-danger" style="padding: 4px 8px; font-size: 0.8rem; width: auto; margin:0;" onclick="deleteUser(${u.id})">Delete</button>
                                </td>
                            </tr>
                        `;
                    });

                    document.getElementById('page-info').innerText = `Page ${currentPage} of ${totalPages || 1}`;
                } else {
                    document.body.innerHTML = '<main><h2 style="color:var(--warning-color);text-align:center;">403 Forbidden. Admins only.</h2></main>';
                }
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('prev-btn').addEventListener('click', () => {
            if(currentPage > 1) { currentPage--; loadUsers(); }
        });
        document.getElementById('next-btn').addEventListener('click', () => {
            if(currentPage < totalPages) { currentPage++; loadUsers(); }
        });

        loadUsers();
    </script>
</body>
</html>
